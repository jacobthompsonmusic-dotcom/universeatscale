// shared painting helpers
function paintBands(g, C, bands, poleCol, r, contrast) {
  for (const [l0, l1, col] of bands) { g.fillStyle = col; g.beginPath(); g.arc(C, C, C * Math.cos(l0 * DEG), 0, TAU); g.arc(C, C, C * Math.cos(l1 * DEG), 0, TAU, true); g.fill(); }
  for (let i = 0; i < 9000; i++) {
    const lat = Math.pow(r(), 0.8) * 88, rad = C * Math.cos(lat * DEG), a = r() * TAU, len = (0.02 + r() * 0.12) * (1 - lat / 120);
    g.strokeStyle = r() < 0.5 ? `rgba(255,245,225,${(0.04 + r() * 0.08) * contrast})` : `rgba(90,60,40,${(0.04 + r() * 0.08) * contrast})`;
    g.lineWidth = 1 + r() * 3; g.beginPath(); g.arc(C, C, rad, a, a + len); g.stroke();
  }
  const S = C * 2, b = document.createElement('canvas'); b.width = b.height = S / 4; const bg = b.getContext('2d');
  bg.imageSmoothingQuality = 'high'; bg.drawImage(g.canvas, 0, 0, S / 4, S / 4);
  g.save(); g.beginPath(); g.arc(C, C, C, 0, TAU); g.clip(); g.globalAlpha = 0.6; g.imageSmoothingQuality = 'high'; g.drawImage(b, 0, 0, S, S); g.restore();
}
function vortex(g, x, y, rad, c0, c1, c2) {
  const gr = g.createRadialGradient(x, y, 0, x, y, rad);
  gr.addColorStop(0, c0); gr.addColorStop(0.5, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  for (let k = 0; k < 5; k++) {
    g.strokeStyle = `rgba(235,235,238,${0.25 - k * 0.04})`; g.lineWidth = 1.5; g.beginPath();
    for (let t = 0; t < 4.5; t += 0.05) { const rr = rad * 0.12 * Math.exp(0.42 * t), aa = -t + k * 1.26; g.lineTo(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr); if (rr > rad) break; }
    g.stroke();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (opts.extra && sys.extra) softBand(px, py, sys.extra.in * view.s, sys.extra.out * view.s, sys.extra.rgb, sys.extra.a);
  if (opts.rings) {
    for (const rg of sys.rings) if (!rg.dense && !rg.line) softBand(px, py, rg.in * view.s, rg.out * view.s, rg.rgb, rg.a, rg.peak);
    for (const rg of sys.rings) if (rg.line) {

      ctx.strokeStyle = `rgba(200,200,205,${(rg.a * (0.45 + 0.55 * Math.min(1, w))).toFixed(3)})`; ctx.lineWidth = Math.max(0.8, w);
      ctx.beginPath(); ctx.arc(px, py, rr, 0, TAU); ctx.stroke();

        ctx.strokeStyle = 'rgba(235,235,240,0.9)'; ctx.lineWidth = Math.max(1.6, w * 2.5);

        }

    }

      const g = ctx.createRadialGradient(px, py, sys.denseR[0] * view.s, px, py, sys.denseR[1] * view.s);
      for (const [o, c] of sys.denseStops) g.addColorStop(o, c);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, sys.denseR[1] * view.s, 0, TAU); ctx.arc(px, py, sys.denseR[0] * view.s, 0, TAU, true); ctx.fill();

  }

}

function drawLabels(px, py, R) {
  const boxes = [[px - R, py - R, 2 * R, 2 * R]];
  const list = [...screenPts].sort((a, b) => (a.o === selected ? -1 : b.o === selected ? 1 : a.o.pr - b.o.pr));
  for (const { o, X, Y, rad } of list) {

      if (R < 30) { ctx.font = 'italic 14.5px "IM Fell English", Georgia, serif'; ctx.fillStyle = '#f6dcb4'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(sys.name, px + Math.max(R, 6) + 8, py); boxes.push([px + R + 6, py - 8, 60, 16]); }
      continue;
    }
    const big = o.pr === 0;
    ctx.font = (big ? '600 13px' : '500 12px') + ' "IM Fell English", Georgia, serif';
    const w = ctx.measureText(o.name).width, h = 15, bx = X + rad + 7, by = Y - h / 2;
    if (bx > Wd || by > Ht || by + h < 0) continue;
    if (boxes.some(b => bx < b[0] + b[2] && bx + w > b[0] && by < b[1] + b[3] && by + h > b[1])) continue;
    boxes.push([bx - 2, by - 2, w + 4, h + 4]);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(5,6,10,0.7)'; ctx.fillText(o.name, bx + 1, Y + 1);
    ctx.fillStyle = big ? '#fff6e6' : 'rgba(235,230,222,0.85)'; ctx.fillText(o.name, bx, Y);
  }

    for (const rg of sys.rings) {

      if (mid < 70 || Y > Ht - 120 || Y < 0 || (width < 14 && !rg.line && !rg.label.includes('MAIN'))) continue;
      const w = ctx.measureText(rg.label).width;

function drawEarthArrow(px, py, R) {

function updateScale() {
  const km = niceStep(130 / view.s);
  document.getElementById('scale-bar').style.width = km * view.s + 'px';
  document.getElementById('scale-label').textContent = fmtKm(km) + (km >= sys.R * 0.5 ? ` · ${+(km / sys.R).toFixed(1)} ${sys.name} radii` : '');
}
function updateClock() {
  document.getElementById('date').textContent = new Date(simMs).toLocaleString('en-CA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  document.getElementById('spd').textContent = speedLabel(Math.pow(10, logTarget));

// ---------- info ----------
function ringAt(km, tol) {

}
const viewCache = {};
function showView(o) {

  document.getElementById('info-view-img').src = viewCache[o.name];
  document.getElementById('info-view-img').alt = `Illustration: ${spec.caption}`;
  document.getElementById('info-view-cap').textContent = `${spec.caption} — tap to enlarge`;
  fig.style.display = 'block';
  fig.onclick = () => {
    document.getElementById('lb-img').src = viewCache[o.name];

    document.getElementById('lb-note').textContent = spec.note;
    document.getElementById('lightbox').classList.add('on');

}
document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').classList.remove('on');
function select(o) {

}
function refreshInfo() {

  document.getElementById('info-dot').style.background = isRing ? G.color : o.color;

  else if (isRing) f.push([`From ${sys.name}'s centre`, `${fmtKm(o.in)} – ${fmtKm(o.out)}`], ['Width', fmtKm(o.out - o.in)], [o.gap ? 'Why' : 'Made of', o.made]);

// ---------- camera ----------
function flyTo(x, y, span, obj, dur = 1100) {
  anim = { from: { ...view }, to: { x, y, s: clampS(Math.min(Wd, Ht) / span) }, obj, t0: performance.now(), dur };
  follow = obj || null;
}
function zoomAt(X, Y, f) {
  const [wx, wy] = toWorld(X, Y); anim = null;
  view.s = clampS(view.s * f);
  if (follow) return;
  view.x = wx - (X - Wd / 2) / view.s; view.y = wy - (Y - Ht / 2) / view.s;
}
const spanFor = o => o.in ? Math.max((o.out + 20000) * 2.4, 60000) : o.group === sys.bigGroup ? Math.max(o.r * 14, 8000) : o.a < 600000 ? 60000 : Math.max(o.a * 0.5, 2e6);

// ---------- input ----------
function pick(X, Y) {
  let best = null, bd = Infinity;
  for (const p of screenPts) { const d = Math.hypot(p.X - X, p.Y - Y) - p.rad; if (d < 10 && d < bd) { bd = d; best = p.o; } }
  return best;
}
const pointers = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {

  if (pointers.size === 1) drag = { X: e.clientX, Y: e.clientY, vx: view.x, vy: view.y, moved: 0 };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s }; drag = null; }
});
cv.addEventListener('pointermove', e => {

  if (pinch && pointers.size === 2) {

    zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, clampS(pinch.s * d / pinch.d) / view.s);
  } else if (drag) {
    const dx = e.clientX - drag.X, dy = e.clientY - drag.Y; drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.moved > 3) {

      cv.classList.add('dragging'); view.x = drag.vx - dx / view.s; view.y = drag.vy - dy / view.s;
    }
  }
  const [wx, wy] = toWorld(e.clientX, e.clientY), km = Math.hypot(wx, wy);
  document.getElementById('r-km').textContent = km < sys.R ? `inside ${sys.name}` : `${fmtKm(km)} · ${(km / sys.R).toFixed(1)} ${sys.name} radii`;
  if (!drag || drag.moved <= 3) {
    const h = pick(e.clientX, e.clientY); hover = h; cv.classList.toggle('pointing', !!h);
    const tip = document.getElementById('tip');
    if (h) { tip.textContent = h.name; tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; }

  }
});
const endPtr = e => {

cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { document.getElementById('tip').style.display = 'none'; hover = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))); }, { passive: false });
cv.addEventListener('dblclick', e => { if (!pick(e.clientX, e.clientY)) zoomAt(e.clientX, e.clientY, 2.5); });

document.getElementById('zin').onclick = () => zoomAt(Wd / 2, Ht / 2, 2);
document.getElementById('zout').onclick = () => zoomAt(Wd / 2, Ht / 2, 0.5);
document.querySelector('#info .close').onclick = () => select(null);
document.getElementById('info-follow').onclick = () => {
  if (follow === selected) follow = null; else { follow = selected; anim = { from: { ...view }, to: { x: 0, y: 0, s: view.s }, obj: selected, t0: performance.now(), dur: 700 }; }
  refreshInfo();
};
document.querySelectorAll('.tg').forEach(b => b.onclick = () => { opts[b.dataset.k] = !opts[b.dataset.k]; b.classList.toggle('on', opts[b.dataset.k]); });

const playBtn = document.getElementById('play'), speedIn = document.getElementById('speed');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); };
speedIn.oninput = () => { logTarget = posToLog(+speedIn.value); updateClock(); };
document.getElementById('now').onclick = () => { simMs = Date.now(); logTarget = logCur = 0; speedIn.value = 0; updateClock(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  if (e.key === '+' || e.key === '=') zoomAt(Wd / 2, Ht / 2, 1.6);
  if (e.key === '-' || e.key === '_') zoomAt(Wd / 2, Ht / 2, 1 / 1.6);
  if (e.key === 'Escape') select(null);
});

// search: picking a result jumps to it (and follows a moon)
const sIn = document.getElementById('search'), sRes = document.getElementById('results');
let hits = [], active = 0;
const go = o => {
  select(o);
  if (o.isPlanet) flyTo(0, 0, sys.presets[0][1]);
  else if (o.in) flyTo(0, 0, spanFor(o));
  else flyTo(o.x, o.y, spanFor(o), o, 1300);
  sRes.style.display = 'none'; sIn.blur();
};
function renderHits() {
  sRes.innerHTML = hits.map((o, i) => `<button data-i="${i}" class="${i === active ? 'active' : ''}"><span class="dot" style="background:${o.in ? '#f0d7b4' : o.color}"></span>${o.name}<small>${o.in ? (o.gap ? 'Gap' : 'Ring') : sys.groups[o.group].label}</small></button>`).join('');
  sRes.style.display = hits.length ? 'block' : 'none';
}
sIn.addEventListener('input', () => {
  const q = sIn.value.trim().toLowerCase(); active = 0;
  const pool = [...sys.all, ...sys.rings];
  const label = o => o.in ? 'ring' : sys.groups[o.group].label;
  hits = q ? pool.filter(o => (o.name + ' ' + label(o)).toLowerCase().includes(q))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || (a.pr ?? 2) - (b.pr ?? 2)).slice(0, 10) : [];
  renderHits();
});
sIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { active = Math.min(active + 1, hits.length - 1); renderHits(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderHits(); e.preventDefault(); }
  if (e.key === 'Enter' && hits[active]) go(hits[active]);
  if (e.key === 'Escape') { sIn.value = ''; hits = []; renderHits(); sIn.blur(); }
});

// ---------- switching planets ----------
function setSystem(key, instant) {
  sys = SYSTEMS[key] || JUPITER;
  selected = null; follow = null; anim = null; hover = null;
  document.getElementById('info').style.display = 'none';
  document.querySelectorAll('.switch button').forEach(b => b.classList.toggle('on', b.dataset.sys === sys.key));
  document.getElementById('title').textContent = sys.title;
  document.getElementById('intro').textContent = sys.intro;
  document.getElementById('to3d').href = '../giant-planets-3d/index.html#' + sys.key;
  document.getElementById('note').textContent = sys.note;
  document.getElementById('r-from').textContent = `From ${sys.name}`;
  document.getElementById('r-km').textContent = '—';
  sIn.value = ''; sIn.placeholder = sys.hint; hits = []; renderHits();
  document.getElementById('legend-rows').innerHTML = Object.entries(sys.groups).filter(([k]) => k !== 'planet')
    .map(([, g]) => `<div class="row"><span class="dot" style="background:${g.color}"></span>${g.label}</div>`).join('');
  const te = document.getElementById('tg-extra');
  te.style.display = sys.extra ? '' : 'none'; if (sys.extra) te.textContent = sys.extra.label;
  const pr = document.getElementById('presets');
  pr.innerHTML = sys.presets.map(([lab, , title], i) => `<button class="txt" data-i="${i}" title="${title}">${lab}</button>`).join('');
  pr.querySelectorAll('button').forEach(b => b.onclick = () => flyTo(0, 0, sys.presets[+b.dataset.i][1]));
  try { if (location.hash !== '#' + sys.key) history.replaceState(null, '', '#' + sys.key); } catch (e) {}
  if (instant) { view.x = 0; view.y = 0; view.s = clampS(Math.min(Wd, Ht) / sys.start); }
  else flyTo(0, 0, sys.start, null, 900), (view.s = clampS(Math.min(Wd, Ht) / (sys.start * 3)), view.x = 0, view.y = 0, anim.from = { ...view });
  updatePositions(simMs);
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => { if (b.dataset.sys !== sys.key) setSystem(b.dataset.sys); });
addEventListener('hashchange', () => { const k = location.hash.slice(1); if (SYSTEMS[k] && k !== sys.key) setSystem(k); });


// tap the map to tuck the intro away; the i button brings it back
const topPanel = document.getElementById('top'), aboutBtn = document.getElementById('about');
const setCollapsed = c => { topPanel.classList.toggle('collapsed', c); aboutBtn.textContent = c ? 'i' : '×'; aboutBtn.setAttribute('aria-label', c ? 'Show intro' : 'Hide intro'); };
aboutBtn.onclick = () => setCollapsed(!topPanel.classList.contains('collapsed'));
cv.addEventListener('pointerdown', () => { setCollapsed(true); const r = document.getElementById('results'); if (r) r.style.display = 'none'; document.getElementById('search').blur(); });
setCollapsed(false);
addEventListener('resize', resize);
resize();
setSystem(SYSTEMS[location.hash.slice(1)] ? location.hash.slice(1) : 'jupiter', true);
updateClock();
requestAnimationFrame(frame);
})();
