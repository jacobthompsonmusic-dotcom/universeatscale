    if (o.part === 'mp') f.push(['What it is', `The boundary where ${sys.name}'s magnetic field holds off the solar wind`], ['Sunward edge', `${fmtKm(mp)} · ${M.mp} ${sys.name} radii`], ['Varies between', `${M.range} radii, as the solar wind gusts`], ['Tail', M.tail], ['Field strength', M.field], ['Magnetic tilt', `${M.tilt}° from the spin axis${M.off ? `, offset ${M.off} radii from the centre` : ''}`]);

  const go = document.getElementById('info-go'); go.style.display = isRing || o.sky || o.mag ? 'none' : 'inline-block';
  go.textContent = follow === o ? 'Following — click to stop' : 'Fly here'; go.classList.toggle('on', follow === o);

}
document.querySelector('#info .close').onclick = () => select(null);
document.getElementById('info-go').onclick = () => { if (follow === selected) { follow = null; select(selected); } else flyTo(selected); };
const lastFollowPos = new THREE.Vector3();
function flyTo(o, dist) {
  const rad = o.isPlanet ? cf.R : Math.max(o.r * U, 0.0008);
  const d = dist || (o.isPlanet ? cf.start.dist : Math.max(rad * 7, 0.05));
  // arrive on the sunlit side of a moon, a little above its orbit, so it's seen gibbous rather than as a dark crescent
  const cur = camera.position.clone().sub(controls.target).normalize();
  const dir = o.isPlanet ? cur : sunDir.clone().multiplyScalar(0.8).add(cur.multiplyScalar(0.35)).add(new THREE.Vector3(0, 0.25, 0)).normalize();
  fly = { o, t0: performance.now(), dur: 1600, fromPos: camera.position.clone(), fromTgt: controls.target.clone(), dist: d, dir };
  follow = o.isPlanet ? null : o;

}
function preset(dist, dir) { follow = null; fly = { o: PLANET, t0: performance.now(), dur: 1500, fromPos: camera.position.clone(), fromTgt: controls.target.clone(), dist, dir: dir || camera.position.clone().sub(controls.target).normalize() }; }
const dolly = f => { const off = camera.position.clone().sub(controls.target).multiplyScalar(f); const L = THREE.MathUtils.clamp(off.length(), 0.0002, controls.maxDistance); camera.position.copy(controls.target).add(off.setLength(L)); keepOutside(); };
document.getElementById('zin').onclick = () => dolly(0.7);
document.getElementById('zout').onclick = () => dolly(1.45);

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; collapse(true); });
canvas.addEventListener('pointerup', e => {

  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);

// ===================================================================
//  fine zoom toward the cursor — scroll over a moon to glide in and lock onto it
// ===================================================================
controls.minDistance = 0.0002;
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function bodyUnder(X, Y) {

}
const radiusOf = o => o.isPlanet ? cf.R : Math.max(o.r * U, 0.0008);
function keepOutside() { // never let the camera sink inside the planet or a moon

    if (d < r) { let dir = camera.position.clone().sub(c); if (dir.lengthSq() < 1e-12) dir = camera.position.clone().sub(controls.target); if (dir.lengthSq() < 1e-12) dir.set(0, 0.3, 1); camera.position.copy(c).add(dir.normalize().multiplyScalar(r)); }
  }
}
let lastWheel = 0, gestureHover = null;
addEventListener('wheel', e => {
  if (e.target !== canvas && !labelBox.contains(e.target)) return; // scrolling over the map or a moon's name
  e.preventDefault(); e.stopPropagation(); fly = null;
  const k = e.ctrlKey ? 0.012 : 0.0011, f = Math.exp(THREE.MathUtils.clamp(e.deltaY, -200, 200) * k);

  const now = performance.now();

  lastWheel = now;

  const P = new THREE.Vector3();

}, { passive: false, capture: true });

// ===================================================================
//  UI
// ===================================================================
document.querySelectorAll('.tg').forEach(b => b.onclick = () => { opts[b.dataset.k] = !opts[b.dataset.k]; b.classList.toggle('on', opts[b.dataset.k]); moons.forEach(o => o.line.visible = opts.orbits); faint.visible = opts.faint; milky.visible = opts.milky; magGroup.visible = fieldSpin.visible = opts.mag;
  if (b.dataset.k === 'mag' && opts.mag) { const side = new THREE.Vector3().crossVectors(sunDir, new THREE.Vector3(0, 1, 0)); if (side.lengthSq() < 0.01) side.set(1, 0, 0); side.normalize().add(new THREE.Vector3(0, 0.45, 0)).add(sunDir.clone().multiplyScalar(-0.25)).normalize(); preset(cf.mag.mp * cf.R * 6, side); select(MAG[0]); } });
const playBtn = document.getElementById('play'), speedIn = document.getElementById('speed');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; };
speedIn.oninput = () => { logTarget = +speedIn.value / 1000 * MAXLOG; };
document.getElementById('now').onclick = () => { simMs = Date.now(); logTarget = logCur = 0; speedIn.value = 0; };
const topPanel = document.getElementById('top'), aboutBtn = document.getElementById('about');
const collapse = c => { topPanel.classList.toggle('collapsed', c); aboutBtn.textContent = c ? 'i' : '×'; };
aboutBtn.onclick = () => collapse(!topPanel.classList.contains('collapsed'));
const sIn = document.getElementById('search'), sRes = document.getElementById('results'); let hits = [], active = 0;
function renderHits() { sRes.innerHTML = hits.map((o, i) => `<button data-i="${i}" class="${i === active ? 'active' : ''}"><span class="dot" style="background:${o.color}"></span>${o.name}<small>${sys.groups[o.group].label}</small></button>`).join(''); sRes.style.display = hits.length ? 'block' : 'none'; }
sIn.addEventListener('input', () => { const q = sIn.value.trim().toLowerCase(); active = 0; hits = q ? [PLANET, ...moons].filter(o => o.name.toLowerCase().includes(q)).sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || a.pr - b.pr).slice(0, 10) : []; renderHits(); });
sIn.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { active = Math.min(active + 1, hits.length - 1); renderHits(); } if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderHits(); } if (e.key === 'Enter' && hits[active]) { flyTo(hits[active]); sRes.style.display = 'none'; sIn.blur(); } });

document.querySelectorAll('.switch button').forEach(b => b.onclick = () => { if (CONF[b.dataset.sys] !== cf) { sIn.value = ''; hits = []; renderHits(); build(b.dataset.sys); } });

// ===================================================================
//  loop
// ===================================================================
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
build(CONF[location.hash.slice(1)] ? location.hash.slice(1) : 'jupiter');

function frame(t) {
  const dt = lastT ? Math.min(t - lastT, 100) : 0; lastT = t;
  logCur += (logTarget - logCur) * Math.min(1, dt / 220);

    document.getElementById('spd').textContent = speedLabel(Math.pow(10, logTarget));
  }

}
