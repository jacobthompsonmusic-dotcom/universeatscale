<!DOCTYPE html><html><body style="margin:0;background:#04050a"><canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'); const W = innerWidth, H = innerHeight; cv.width = W; cv.height = H;
const gl = cv.getContext('webgl', { premultipliedAlpha: true });
window.renderView = async (v) => {
  if (!window.prog) {
    const fs = 'precision highp float;\n' + await (await fetch('galaxy.glsl')).text();
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
    const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.,1.);}')); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); gl.useProgram(p);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const img = new Image(); img.src = '../../milky-way/galaxy-disc.jpg'; await img.decode();
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    window.prog = p;
  }
  const p = window.prog, U = n => gl.getUniformLocation(p, n);
  gl.uniform3fv(U('uCam'), v.cam); gl.uniform3fv(U('uRight'), v.right); gl.uniform3fv(U('uUp'), v.up); gl.uniform3fv(U('uFwd'), v.fwd);
  gl.uniform2f(U('uRes'), W, H); gl.uniform1f(U('uTanH'), v.tanH || 0); gl.uniform1f(U('uOrtho'), v.ortho ? 1 : 0); gl.uniform1f(U('uHalfH'), v.halfH || 1);
  gl.uniform1f(U('uExpo'), v.expo || 1.2); gl.uniform1f(U('uAlpha'), 1); gl.uniform1i(U('uGal'), 0);
  gl.viewport(0, 0, W, H); gl.clearColor(0.016, 0.02, 0.04, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  return 'ok';
};
</script></body></html>
